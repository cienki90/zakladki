name: Build Windows EXE

# Buduje pojedynczy plik Zakladki.exe na runnerze Windows za pomoca PyInstaller.
# .exe jest udostepniany jako artefakt builda, a przy wypchnieciu tagu v*
# dodatkowo publikowany jako asset w GitHub Releases.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Zakladki.exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm zakladki.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zakladki-exe
          path: dist/Zakladki.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Zakladki.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
